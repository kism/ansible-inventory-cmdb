[project]
name = "ansibleinventorycmdb-worker"
version = "0.1.0"
description = "Cron-triggered Cloudflare Worker that renders the CMDB into a public R2 bucket"
requires-python = ">=3.13" # Pyodide's Python version

# ansibleinventorycmdb itself is not here: pywrangler resolves dependencies against the Pyodide package index with
# --no-build, so it cannot install a local path. The build step in wrangler.jsonc copies the package in next to the
# entrypoint instead, which is why its runtime dependencies are repeated here.
#
# No aiohttp and no fastapi. Neither is reachable from this entrypoint: the Worker passes its own fetch to
# AnsibleCMDB.build(), and site.py never imports FastAPI.
dependencies = ["jinja2", "pydantic", "pyyaml"]

[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk"]
