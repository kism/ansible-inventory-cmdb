---
name: Test

on:
  push:
    branches:
      - main
      - test
    paths-ignore: &paths-ignore
      - "**/README*"
      - ".github/workflows/lint.yml"
      - ".github/workflows/check_types.yml"
      - ".github/workflows/build.yml"
  pull_request:
    paths-ignore: *paths-ignore

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest & vitest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload, no token secret needed
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Setup pnpm
        uses: pnpm/setup@v3 # Version comes from packageManager in package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the project
        run: |
          uv sync --no-group type --no-group lint --no-group worker
          pnpm install --frozen-lockfile

      - name: Test
        run: pnpm coverage # vitest, then pytest under coverage: invocation in pyproject.toml [tool.coverage.run]

      - name: Coverage report
        run: uv run coverage xml # xml report needed for codecov; vitest already wrote frontend/coverage/lcov.info

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
