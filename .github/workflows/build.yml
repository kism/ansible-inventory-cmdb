---
name: Build

on:
  push:
    branches:
      - main
      - test
    paths-ignore: &paths-ignore
      - "**/README*"
      - ".github/workflows/lint.yml"
      - ".github/workflows/check_types.yml"
      - ".github/workflows/test.yml"
  pull_request:
    paths-ignore: *paths-ignore

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6 # Version comes from packageManager in package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Boot the Worker under Pyodide
        run: pnpm check_worker

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6 # Version comes from packageManager in package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc -p frontend

      - name: Build
        run: pnpm build
