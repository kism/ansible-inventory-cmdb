---
name: Type Check

on:
  push:
    branches:
      - main
      - test
    paths-ignore: &paths-ignore
      - "**/README*"
      - ".github/workflows/lint.yml"
      - ".github/workflows/test.yml"
      - ".github/workflows/build.yml"
  pull_request:
    paths-ignore: *paths-ignore

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ty:
    name: ty
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Install the project
        # The test group stays: ty checks tests/ too, and it's what pulls in pytest and the `server` extra.
        run: uv sync --no-group lint --no-group worker

      - name: Check types
        run: uv run ty check
