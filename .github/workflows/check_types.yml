---
name: Type Check (ty)

on:
  push:
    branches:
      - main
      - test
    paths-ignore:
      - "**/README*"

jobs:
  ty:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        # The test group stays: ty checks tests/ too, and it's what pulls in pytest and the `server` extra.
        run: uv sync --no-group lint --no-group dev --no-group worker

      - name: Check types with ty
        run: uv run ty check
