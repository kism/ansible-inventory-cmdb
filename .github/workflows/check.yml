---
name: Check (Ruff, Fonts, Worker)

on:
  push:
    branches:
      - main
      - test
    paths-ignore:
      - "**/README*"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3

  check_fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - run: npm ci
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: Check the fonts zy.css declares load in a real browser
        run: npm run check_fonts

  check_worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      # Both the config and the symlink to it are gitignored, so a fresh checkout has neither and the bundle
      # would come up with no config at all. The test config is only parsed here, never fetched from.
      - name: Give the bundle a config to import
        run: |
          mkdir -p instance
          cp tests/configs/valid.yml instance/config.yml
          ln -sf ../instance/config.yml src/config.yml
      - name: Boot the Worker under Pyodide
        run: npm run check_worker
