[project]
name = "ansibleinventorycmdb"
version = "1.2.0"
description = "Generates a CMDB webpage from an ansible git repository"
authors = [{ name = "Kieran Gee", email = "kieran.lost.the.game@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"                                                    # 3.13 is what Pyodide runs, see wrangler.jsonc

# pywrangler reads *only* this list and installs it into the Worker, so everything here must have a Pyodide wheel
# and everything the Worker can't use belongs in an extra below. See README_Wrangler_dev.md.
dependencies = [
    "httpx>=0.28.1",    # Pyodide's build is patched to use fetch(); aiohttp has no usable wasm wheel at all
    "jinja2>=3.1.6",    # Not pulled in by fastapi, needed for Jinja2Templates
    # Used directly by config.py and logger.py, not just via fastapi. The floor is what the Pyodide index
    # serves (2.10.6) — raising it makes `pywrangler sync` unresolvable, which npm run check_worker catches.
    "pydantic>=2.10.6",
    "pyyaml>=6.0.2",
]

# The web app, which neither the Worker nor `ansibleinventorycmdb-generate` needs: uv sync --extra server
[project.optional-dependencies]
server = ["fastapi>=0.115.0", "uvicorn[standard]>=0.52.1"]

[project.urls]
Repository = "https://github.com/kism/ansible-inventory-cmdb"

[project.scripts]
ansibleinventorycmdb = "ansibleinventorycmdb.__main__:main"
ansibleinventorycmdb-generate = "ansibleinventorycmdb.site:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src/ has non-package siblings now (entry.py, and the config.yml symlink), so don't leave this to inference.
[tool.hatch.build.targets.wheel]
packages = ["src/ansibleinventorycmdb"]

[dependency-groups]
dev = ["pyright"]

type = ["ty"]

lint = ["ruff"]

test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-random-order",
    "types-pyyaml",
    "detect-test-pollution",
    "httpx2",                       # Required by fastapi.testclient.TestClient
    "ansibleinventorycmdb[server]", # The tests exercise the web app, so they need the extra
]

# The Cloudflare Worker toolchain. pywrangler shells out to `npx wrangler`, which is pinned in package.json.
worker = ["workers-py", "workers-runtime-sdk"]

[tool.uv]
package = true
default-groups = ["dev", "test", "type", "lint", "worker"]


# src/entry.py imports the `workers` SDK, which only exists inside the Pyodide runtime.
[tool.ty.src]
exclude = ["src/entry.py"]

[tool.pyright]
exclude = [
    "**/__pycache__, **/.*",
    "src/entry.py",
    "**/.venv",
    ".venv-workers",         # pywrangler's Pyodide-pinned venv
    "python_modules",        # pywrangler's vendored Worker dependencies
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]

[tool.ruff]
cache-dir = "~/.cache/ruff"
line-length = 120

[tool.ruff.lint]
select = ["ALL"] # Include absolutely all of Ruff's rules.
ignore = [
    # Modules
    "DJ",  # Django not required
    "PTH", # builtin 'open' is fine, not going to use pathlib
    "DTZ", # no need to specify timezone for time objects
    "CPY", # Copyright is LICENSE file

    # Specific rules
    # "ANN101", # Why define self type for object functions...
    "TD002",  # Verbose TODO, only I work on this project
    "TD003",  # Verbose TODO, only I work on this project
    "ISC001", # conflict in the formatter
    "COM812", # conflict in the formatter
    "G004",   # Fine to log this way
    "S301",   # No user input, happy to use pickle
]

[tool.ruff.lint.per-file-ignores]
"src/entry.py" = [
    "INP001", # The Worker entrypoint is a top-level module in the bundle, not part of the package
]

"tests/*.py" = [
    # Modules
    "ARG", # Unused function args -> fixtures nevertheless are functionally relevant
    "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "ANN", # Don't care about annotations in tests
    "D",   # Don't care about docstrings in tests

    # Specific rules
    "S101",   # asserts allowed in tests.
    "SLF001", # Accessing private members is needed for testing.
    "INP001", # __init__.py not needed for PyTest.
    "PT004",  # monkeypatches don't return.
    "ANN001", # Tests don't need type hints.
    "S311",   # I'll assume no real crypto will be done in PyTest.
    "BLE001", # BaseException is fine in tests
]


[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 40

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
command_line = ".venv/bin/pytest -q"
source = ["ansibleinventorycmdb"]
context = "test"

[tool.coverage.html]
show_contexts = true
